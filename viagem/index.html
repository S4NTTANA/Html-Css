<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Combustível</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline>
        <source src="Videos/rodovia.mp4" type="video/mp4">
    </video>

    <div class="Calcular">
        <h1>Calcular Combustível</h1>
        <span>Distância da viagem (km):</span>
        <input id="distancia" type="number" min="1" placeholder="Ex: 150">
        <span>Consumo do veículo (km/l):</span>
        <input id="consumo" type="number" min="1" step="0.1" placeholder="Ex: 17">
        <span>Preço do combustível (R$):</span>
        <input id="preco" type="number" min="0.01" step="0.01" placeholder="Ex: 5.99">
        <button id="botao">Calcular</button>
        <span id="resultado"></span>
    </div>
    <script src="JS/index.js"></script>
</body>
</html>
